name: Build Windows Wheel torch270cu126-cp311-cp311-win_amd64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA Toolkit 12.6
        run: choco install cuda --version=12.6.3.561 -y

      - name: Upgrade pip & install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install PyTorch, TorchVision, TorchAudio (CUDA 12.6)
        run: |
          pip3 install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126

      - name: Build with WindowsBuilder.bat
        run: |
          call WindowsBuilder.bat install
          python setup.py bdist_wheel --python-tag cp311 --plat-name win_amd64

      - name: Rename wheel
        run: |
          for /f %%f in ('dir /b dist\*.whl') do ren dist\%%f torch270cu126-cp311-cp311-win_amd64.whl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch270cu126-cp311-cp311-win_amd64.whl
          path: dist/torch270cu126-cp311-cp311-win_amd64.whl
